services:
  app:
    build:
      context: .
      dockerfile: docker/Dockerfile
    container_name: fintrack-app
    restart: unless-stopped
    working_dir: /var/www
    volumes:
      - ./:/var/www
    networks:
      - fintrack-network

  web:
    image: nginx:alpine
    container_name: fintrack-web
    restart: unless-stopped
    ports:
      - "8000:80"
    volumes:
      - ./:/var/www
      - ./docker/nginx.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - app
    networks:
      - fintrack-network

networks:
  fintrack-network:
    driver: bridge

